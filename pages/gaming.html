<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>RGaming342's Games</title>
	<style>
		.username{
			margin: 2%;
			position: fixed;
			top: 0;
			left: 0;
			text-decoration: none;
			color: var(--main-color);
			:root{ --main-color: black; }
			:visited{ text-decoration: none; color: var(--main-color); }
			:link{ text-decoration: none; color: var(--main-color); }
			:hover{ text-decoration: underline; color: blue; }
			:active{ text-decoration: none; color: purple; }
		}
		
	</style>
	<script type="module">
		import { getUserName } from "../main.js";
		import { gameLoop, init } from "./games/pong.js";
		
		window.addEventListener("DOMContentLoaded", async () => {
			const user = await getUserName();
			const usernameElement = document.querySelector('.username');
			
			if(user && user.name.length>0){
				const Name = document.getElementById("UserInfo");
				Name.textContent = `${user.name}`;
				usernameElement.style.color = user.color;
			}
			init();
			gameLoop();
		});
	</script>
</head>
<body style="background-color:#666666;">
	<h3 class="username"><a href="user-info.html" id="UserInfo">User-Info</a></h3>
