<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<title>UncontainedByte's Website</title>
	<style>
		.post {
			margin: auto;
			border: 4px solid #ccc;
			padding: 0.5rem;
			width:fit-content;
			margin-bottom: 1rem
		}
		.username{
			margin: 2%;
			position: fixed;
			top: 0;
			left: 0;
			text-decoration: none;
			color: var(--main-color);
			:root{ --main-color: black; }
			:visited{ text-decoration: none; color: var(--main-color); }
			:link{ text-decoration: none; color: var(--main-color); }
			:hover{ text-decoration: underline; color: blue; }
			:active{ text-decoration: none; color: purple; }
		}
		
	</style>
	<script type="module">
		import { getUserName } from "./main.js";
		
		window.addEventListener("DOMContentLoaded", async () => {
			const user = await getUserName();
			const usernameElement = document.querySelector('.username');
			
			if(user && user.name.length>0){
				const Name = document.getElementById("UserInfo");
				Name.textContent = `${user.name}`;
				usernameElement.style.color = user.color;
			}
			
		});
	</script>
</head>
<body style="background-color:#666666;">
	<h2 align="center">Hello</h2>
	<h1 align="center">Im UncontainedByte</h1>
	<h2 align="center">this is my website,</h2>
	<h3 class="username"><a href="pages/user-info.html" id="UserInfo">User-Info</a></h3>
	
	<h4 align="center"><a href="pages/gaming.html">Games</a></h4>
	<h4 align="center"><a href="pages/editor.html">Editor</a></h4>

	<p align="center">links to my stuff:</p>

	<p align="center"><a href="https://www.youtube.com/@UncontainedByte" target="_blank">Youtube</a></p>
</body>
</html>
